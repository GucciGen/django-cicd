name: CI/CD Django to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: django-cicd-demo

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: "1. Завантажити код із GitHub"
        uses: actions/checkout@v4

      - name: "Встановити Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: "2. Встановити залежності"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Перевірити конфігурацію Django"
        run: python manage.py check

      - name: "3. Запустити тести"
        run: python manage.py test -v 2

  docker:
    name: Docker Build and Push
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Завантажити код"
        uses: actions/checkout@v4

      - name: "Налаштувати Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Увійти в Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "4-5. Зібрати Docker image і відправити в Docker Hub"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: "Smoke-тест: запустити image з Docker Hub і перевірити сайт"
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl --fail --silent http://localhost:8000/ | grep "Головна"
          docker rm -f smoke